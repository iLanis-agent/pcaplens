<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PcapLens - pcap inspector in your browser</title>
<style>
:root{--bg:#0b0e14;--panel:#121722;--panel2:#0e131d;--line:#232c3d;--fg:#dbe4f0;--dim:#7d8ba1;--acc:#5cc8ff;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;letter-spacing:.5px}
header h1 span{color:var(--acc)}
header .sub{color:var(--dim);font-size:13px}
.wrap{padding:18px 22px;max-width:1280px;margin:0 auto}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
button,.filebtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
button:hover,.filebtn:hover{border-color:var(--acc);color:var(--acc)}
button.active{border-color:var(--acc);color:var(--acc);background:#10202e}
input[type=file]{display:none}
.summary{display:flex;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--dim)}
.summary b{color:var(--fg);font-weight:600}
.notice{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:none}
.notice.warn{display:block;background:#2a2110;border:1px solid #6b5313;color:var(--warn)}
.notice.err{display:block;background:#2a1010;border:1px solid #6b1313;color:var(--err)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--bg)}
tbody tr{cursor:pointer}
tbody tr:hover{background:#16202e}
tbody tr.sel{background:#10202e;outline:1px solid var(--acc)}
td.num{color:var(--dim);font-variant-numeric:tabular-nums}
td .proto{font-weight:600}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:900px){.detail{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 8px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.lay{margin:0 0 10px;padding:0 0 8px;border-bottom:1px dashed var(--line)}
.lay:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.lay .lname{color:var(--acc);font-weight:600;font-size:13px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:2px 10px;font-size:13px}
.kv div:nth-child(odd){color:var(--dim)}
pre.hex{margin:0;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);overflow-x:auto;white-space:pre}
.hex .off{color:var(--dim)}
.hex .asc{color:var(--dim)}
.badgeok{color:var(--ok)}.badgebad{color:var(--err)}
.empty{color:var(--dim);padding:30px 0;text-align:center}
footer{margin:26px 0 10px;text-align:center;color:var(--dim);font-size:12px}
footer a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>Pcap<span>Lens</span></h1>
  <div class="sub">pcap inspector - packet list, layer decode, checksum verification, all in the browser</div>
</header>
<div class="wrap">
  <div class="controls">
    <label class="filebtn">Open .pcap<input id="file" type="file" accept=".pcap,.cap,.pcapng,application/vnd.tcpdump.pcap"></label>
    <span style="color:var(--dim);font-size:12px">presets:</span>
    <button data-preset="tcp_http">TCP / HTTP</button>
    <button data-preset="udp_dns">DNS query+answer</button>
    <button data-preset="icmp_arp">ICMP + ARP</button>
    <button data-preset="ipv6">IPv6</button>
    <button data-preset="nano">nanosecond</button>
    <button data-preset="bad_trunc">truncated</button>
  </div>
  <div id="err" class="notice err"></div>
  <div id="warn" class="notice warn"></div>
  <div id="summary" class="summary" style="display:none"></div>
  <div id="tablebox"><div class="empty">Open a .pcap file or pick a preset. Nothing leaves your machine - parsing is 100% local.</div></div>
  <div class="detail" id="detail" style="display:none">
    <div class="card"><h3>Layers</h3><div id="layers"></div></div>
    <div class="card"><h3>Hex</h3><pre class="hex" id="hex"></pre></div>
  </div>
  <footer>PcapLens - engine verified against <a href="https://scapy.net/" target="_blank" rel="noopener">scapy</a> (500 field checks). <a href="index.html">about</a></footer>
</div>
<script src="engine.js"></script>
<script>
'use strict';
var PRESETS={"tcp_http": "1MOyoQIABAAAAAAAAAAAAP//AAABAAAAsPPEaocYBAA2AAAANgAAAKq7zAAAAqq7zAAAAQgARQAAKAABAABABoNCwKgBCl242CLHOABQAAAD6AAAAABQAiAAzOQAALDzxGrgGQQANgAAADYAAACqu8wAAAGqu8wAAAIIAEUAACgAAQAAQAaDQl242CLAqAEKAFDHOAAAE4gAAAPpUBIgALlLAACw88RqdhoEADYAAAA2AAAAqrvMAAACqrvMAAABCABFAAAoAAEAAEAGg0LAqAEKXbjYIsc4AFAAAAPpAAATiVAQIAC5TAAAsPPEajIbBABbAAAAWwAAAKq7zAAAAqq7zAAAAQgARQAATQABAABABoMdwKgBCl242CLHOABQAAAD6QAAE4lQGCAAcHoAAEdFVCAvIEhUVFAvMS4xDQpIb3N0OiBleGFtcGxlLmNvbQ0KDQqw88RqKBwEADYAAAA2AAAAqrvMAAABqrvMAAACCABFAAAoAAEAAEAGg0JduNgiwKgBCgBQxzgAABOJAAAED1ARIAC5JQAA", "udp_dns": "1MOyoQIABAAAAAAAAAAAAP//AAABAAAAsPPEal8jBABLAAAASwAAAP///////wL8AAAABQgARQAAPQABAABAEWCbCgAABQgICAjQVQA1ACnKoAAAAQAAAQAAAAAAAAN3d3cHZXhhbXBsZQNjb20AAAEAAbDzxGrhJAQAagAAAGoAAAD///////8C/AAAAAUIAEUAAFwAAQAAQBFgfAgICAgKAAAFADXQVQBIt4wAAIGAAAEAAQAAAAADd3d3B2V4YW1wbGUDY29tAAABAAEDd3d3B2V4YW1wbGUDY29tAAABAAEAAAEsAARduNgi", "icmp_arp": "1MOyoQIABAAAAAAAAAAAAP//AAABAAAAsPPEar9DBAAqAAAAKgAAAP///////6q7zAAAAQgGAAEIAAYEAAGqu8wAAAHAqAEKAAAAAAAAwKgBAbDzxGqHRAQAKgAAACoAAACqu8wAAAGqu8wAAAIIBgABCAAGBAACqrvMAAACwKgBAQAAAAAAAMCoAQqw88RqF0UEADQAAAA0AAAA////////AvwAAAAFCABFAAAmAAEAAEAB93rAqAEKwKgBAQgA/gUSNAABcGluZ2RhdGEwMbDzxGpSRwQANAAAADQAAAD///////8C/AAAAAUIAEUAACYAAQAAQAH3esCoAQHAqAEKAAAGBhI0AAFwaW5nZGF0YTAx", "ipv6": "1MOyoQIABAAAAAAAAAAAAP//AAABAAAAsPPEar9RBABKAAAASgAAAP///////wAAAAAAAIbdYAAAAAAUBkAgAQ24AAAAAAAAAAAAAAABIAENuAAAAAAAAAAAAAAAAhFRAbsAAABNAAAAAFACIAAhFQAAsPPEan9SBABAAAAAQAAAAP///////wAAAAAAAIbdYAAAAAAKOkAgAQ24AAAAAAAAAAAAAAACIAENuAAAAAAAAAAAAAAAAYAArg0AAQABdjY=", "nano": "TTyyoQIABAAAAAAAAAAAAP//AAABAAAAsPPEaocYBAA2AAAANgAAAKq7zAAAAqq7zAAAAQgARQAAKAABAABABoNCwKgBCl242CLHOABQAAAD6AAAAABQAiAAzOQAALDzxGrgGQQANgAAADYAAACqu8wAAAGqu8wAAAIIAEUAACgAAQAAQAaDQl242CLAqAEKAFDHOAAAE4gAAAPpUBIgALlLAACw88RqdhoEADYAAAA2AAAAqrvMAAACqrvMAAABCABFAAAoAAEAAEAGg0LAqAEKXbjYIsc4AFAAAAPpAAATiVAQIAC5TAAAsPPEajIbBABbAAAAWwAAAKq7zAAAAqq7zAAAAQgARQAATQABAABABoMdwKgBCl242CLHOABQAAAD6QAAE4lQGCAAcHoAAEdFVCAvIEhUVFAvMS4xDQpIb3N0OiBleGFtcGxlLmNvbQ0KDQqw88RqKBwEADYAAAA2AAAAqrvMAAABqrvMAAACCABFAAAoAAEAAEAGg0JduNgiwKgBCgBQxzgAABOJAAAED1ARIAC5JQAA", "bad_trunc": "1MOyoQIABAAAAAAAAAAAAP//AAABAAAAsPPEaocYBAA2AAAANgAAAKq7zAAAAqq7zAA="};
var cur=null,curBytes=null,selIdx=-1;
function b64ToBytes(s){var bin=atob(s),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
function fmtTime(p,base){
  var rel=p.ts-base;
  if(rel<0.000001&&rel>-0.000001)return '0.000000';
  if(rel<1)return rel.toFixed(6);
  return rel.toFixed(6);
}
function addrOf(p){
  var src='',dst='';
  if(p.ip){src=p.ip.src;dst=p.ip.dst;}
  else if(p.ipv6){src=p.ipv6.src;dst=p.ipv6.dst;}
  else if(p.arp){src=p.arp.psrc;dst=p.arp.pdst;}
  else if(p.eth){src=p.eth.src;dst=p.eth.dst;}
  return [src,dst];
}
function protoOf(p){
  if(p.dns)return 'DNS';
  if(p.tcp)return 'TCP';
  if(p.udp)return 'UDP';
  if(p.icmp)return 'ICMP';
  if(p.icmpv6)return 'ICMPv6';
  if(p.arp)return 'ARP';
  if(p.ip)return 'IPv4';
  if(p.ipv6)return 'IPv6';
  return p.eth?p.eth.type_name:'?';
}
function infoOf(p){
  if(p.dns){var q=p.dns.qname||'';return p.dns.qr?('response '+(p.dns.answer?('A '+p.dns.answer+' '):'')+'for '+q):('query '+q);}
  if(p.tcp){var t=p.tcp;return t.sport+' -> '+t.dport+' ['+t.flags+'] seq='+t.seq+' ack='+t.ack+' win='+t.window;}
  if(p.udp){var u=p.udp;return u.sport+' -> '+u.dport+' len='+u.len;}
  if(p.icmp){var c=p.icmp;return 'type '+c.type+' code '+c.code+(c.id!==undefined?' id='+c.id+' seq='+c.seq:'');}
  if(p.icmpv6){return p.icmpv6.kind+' id='+p.icmpv6.id+' seq='+p.icmpv6.seq;}
  if(p.arp){var a=p.arp;return a.op===1?('who-has '+a.pdst+' tell '+a.psrc):(a.op===2?(a.psrc+' is-at '+a.hwsrc):('op '+a.op));}
  return '';
}
function showSummary(r,name){
  var s=document.getElementById('summary');
  s.style.display='flex';
  s.innerHTML='<span>file <b>'+esc(name)+'</b></span>'+
    '<span>size <b>'+r.size+' B</b></span>'+
    '<span>version <b>'+r.version[0]+'.'+r.version[1]+'</b></span>'+
    '<span>byte order <b>'+(r.little_endian?'little':'big')+'-endian</b></span>'+
    '<span>resolution <b>'+(r.nano?'nanosecond':'microsecond')+'</b></span>'+
    '<span>snaplen <b>'+r.snaplen+'</b></span>'+
    '<span>linktype <b>'+r.linktype+(r.linktype===1?' (Ethernet)':'')+'</b></span>'+
    '<span>packets <b>'+r.packets.length+'</b></span>';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function renderTable(r){
  var box=document.getElementById('tablebox');
  if(!r.packets.length){box.innerHTML='<div class="empty">No packets decoded.</div>';return;}
  var base=r.packets[0].ts;
  var h='<table><thead><tr><th>#</th><th>time (rel)</th><th>source</th><th>destination</th><th>proto</th><th>len</th><th>info</th></tr></thead><tbody>';
  for(var i=0;i<r.packets.length;i++){
    var p=r.packets[i],a=addrOf(p);
    h+='<tr data-i="'+i+'"><td class="num">'+i+'</td><td class="num">'+fmtTime(p,base)+'</td><td>'+esc(a[0])+'</td><td>'+esc(a[1])+'</td><td><span class="proto">'+protoOf(p)+'</span></td><td class="num">'+p.incl_len+'</td><td>'+esc(infoOf(p))+'</td></tr>';
  }
  box.innerHTML=h+'</tbody></table>';
  var rows=box.querySelectorAll('tr[data-i]');
  for(var j=0;j<rows.length;j++)rows[j].addEventListener('click',function(){select(+this.getAttribute('data-i'));});
}
function kv(pairs){
  var h='<div class="kv">';
  for(var i=0;i<pairs.length;i+=2)h+='<div>'+esc(pairs[i])+'</div><div>'+pairs[i+1]+'</div>';
  return h+'</div>';
}
function ckbadge(ok){return ok?'<span class="badgeok">ok</span>':'<span class="badgebad">BAD</span>';}
function renderLayers(p){
  var h='';
  if(p.eth){
    var pairs=['destination',esc(p.eth.dst),'source',esc(p.eth.src),'ethertype','0x'+p.eth.type.toString(16).padStart(4,'0')+' ('+esc(p.eth.type_name)+')'];
    if(p.eth.vlan)pairs.push('vlan id',String(p.eth.vlan.id),'vlan pcp',String(p.eth.vlan.pcp));
    h+='<div class="lay"><div class="lname">Ethernet</div>'+kv(pairs)+'</div>';
  }
  if(p.ip){
    h+='<div class="lay"><div class="lname">IPv4</div>'+kv(['source',esc(p.ip.src),'destination',esc(p.ip.dst),'protocol',p.ip.proto+' ('+esc(p.ip.proto_name)+')','ttl',String(p.ip.ttl),'total length',String(p.ip.len),'id','0x'+p.ip.id.toString(16).padStart(4,'0'),'flags',String(p.ip.flags),'fragment offset',String(p.ip.frag_off),'header checksum','0x'+p.ip.chksum.toString(16).padStart(4,'0')+' '+ckbadge(p.ip.chksum_ok)])+ '</div>';
  }
  if(p.ipv6){
    h+='<div class="lay"><div class="lname">IPv6</div>'+kv(['source',esc(p.ipv6.src),'destination',esc(p.ipv6.dst),'next header',p.ipv6.nh+' ('+esc(p.ipv6.nh_name)+')','hop limit',String(p.ipv6.hlim),'payload length',String(p.ipv6.plen)])+'</div>';
  }
  if(p.tcp){
    h+='<div class="lay"><div class="lname">TCP</div>'+kv(['source port',String(p.tcp.sport),'dest port',String(p.tcp.dport),'seq',String(p.tcp.seq),'ack',String(p.tcp.ack),'flags','['+esc(p.tcp.flags)+']','window',String(p.tcp.window),'header bytes',String(p.tcp.data_offset),'checksum','0x'+p.tcp.chksum.toString(16).padStart(4,'0')])+'</div>';
  }
  if(p.udp){
    h+='<div class="lay"><div class="lname">UDP</div>'+kv(['source port',String(p.udp.sport),'dest port',String(p.udp.dport),'length',String(p.udp.len),'checksum','0x'+p.udp.chksum.toString(16).padStart(4,'0')])+'</div>';
  }
  if(p.icmp){
    var pairs=['type',String(p.icmp.type),'code',String(p.icmp.code)];
    if(p.icmp.id!==undefined)pairs.push('id',String(p.icmp.id),'seq',String(p.icmp.seq));
    h+='<div class="lay"><div class="lname">ICMP</div>'+kv(pairs)+'</div>';
  }
  if(p.icmpv6){
    h+='<div class="lay"><div class="lname">ICMPv6</div>'+kv(['kind',esc(p.icmpv6.kind),'id',String(p.icmpv6.id),'seq',String(p.icmpv6.seq)])+'</div>';
  }
  if(p.arp){
    h+='<div class="lay"><div class="lname">ARP</div>'+kv(['operation',p.arp.op+' ('+esc(p.arp.op_name)+')','sender mac',esc(p.arp.hwsrc),'sender ip',esc(p.arp.psrc),'target mac',esc(p.arp.hwdst),'target ip',esc(p.arp.pdst)])+'</div>';
  }
  if(p.dns){
    var pairs=['txid','0x'+p.dns.id.toString(16).padStart(4,'0'),'type',p.dns.qr?'response':'query','questions',String(p.dns.qdcount),'answers',String(p.dns.ancount)];
    if(p.dns.qname!==undefined)pairs.push('qname',esc(p.dns.qname),'qtype',String(p.dns.qtype));
    if(p.dns.answer!==undefined)pairs.push('answer',esc(p.dns.answer),'ttl',String(p.dns.ttl));
    h+='<div class="lay"><div class="lname">DNS</div>'+kv(pairs)+'</div>';
  }
  if(!h)h='<div class="empty">Undecoded (packet too short).</div>';
  document.getElementById('layers').innerHTML=h;
}
function renderHex(p){
  var b=curBytes.slice(p.offset+16,p.offset+16+p.incl_len);
  var h='';
  for(var i=0;i<b.length;i+=16){
    var off=('0000'+i.toString(16)).slice(-4);
    var hex='',asc='';
    for(var j=0;j<16;j++){
      if(i+j<b.length){
        var c=b[i+j];
        hex+=('0'+c.toString(16)).slice(-2)+(j===7?'  ':' ');
        asc+=(c>=32&&c<127)?String.fromCharCode(c):'.';
      } else hex+='   ';
    }
    h+='<span class="off">'+off+'</span>  '+hex+' <span class="asc">'+asc+'</span>\n';
  }
  document.getElementById('hex').innerHTML=h;
}
function select(i){
  selIdx=i;
  var rows=document.querySelectorAll('tr[data-i]');
  for(var j=0;j<rows.length;j++)rows[j].classList.toggle('sel',+rows[j].getAttribute('data-i')===i);
  var p=cur.packets[i];
  document.getElementById('detail').style.display='grid';
  renderLayers(p);
  renderHex(p);
}
function load(bytes,name){
  cur=PcapLens.parsePcap(bytes);
  curBytes=bytes;
  selIdx=-1;
  document.getElementById('detail').style.display='none';
  var err=document.getElementById('err'),warn=document.getElementById('warn');
  err.className='notice err';err.textContent='';
  warn.className='notice warn';warn.textContent='';
  if(cur.errors.length){err.className='notice err show';err.style.display='block';err.textContent=cur.errors.join('; ');}
  else err.style.display='none';
  if(cur.warnings.length){warn.style.display='block';warn.textContent=cur.warnings.join('; ');}
  else warn.style.display='none';
  if(cur.errors.length){document.getElementById('summary').style.display='none';document.getElementById('tablebox').innerHTML='<div class="empty">Could not parse this file.</div>';return;}
  showSummary(cur,name);
  renderTable(cur);
  if(cur.packets.length)select(0);
}
document.getElementById('file').addEventListener('change',function(){
  var f=this.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){load(new Uint8Array(rd.result),f.name);};
  rd.readAsArrayBuffer(f);
});
var btns=document.querySelectorAll('button[data-preset]');
for(var k=0;k<btns.length;k++){
  btns[k].addEventListener('click',function(){
    for(var m=0;m<btns.length;m++)btns[m].classList.remove('active');
    this.classList.add('active');
    var name=this.getAttribute('data-preset');
    load(b64ToBytes(PRESETS[name]),name+'.pcap (preset)');
  });
}
</script>
</body>
</html>
